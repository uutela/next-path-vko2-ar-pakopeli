<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homework Coach Agent</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --border: #e2e8f0;
      --highlight: #eab308;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.2rem;
    }
    nav a { color: var(--accent); margin-right: 1rem; font-weight: 600; text-decoration: none; }
    main { max-width: 960px; margin: 1rem auto; padding: 0 1rem 2rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    textarea, input, select {
      width: 100%;
      box-sizing: border-box;
      margin: 0.25rem 0 0.8rem;
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font: inherit;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      font-weight: 600;
      min-height: 48px;
      cursor: pointer;
    }
    .answer { white-space: pre-wrap; font-size: 1.05rem; }
    .chip { display: inline-block; background: var(--accent-soft); border-radius: 999px; padding: 0.2rem 0.6rem; margin: 0.15rem; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <header>
    <h1>Homework Coach</h1>
    <nav>
      <a href="/">Ask</a>
      <a href="/sessions">Sessions</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
